[package]
name = "site-scraper"
version = "1.2.5"
edition = "2021"
description = "CLI utility to mirror a website (HTML + CSS) into a local folder."
license = "MIT"

[[bin]]
name = "site-scraper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.22"
lol_html = "2"
url = "2"
regex = "1"
rand = "0.8"
pathdiff = "0.2"
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
